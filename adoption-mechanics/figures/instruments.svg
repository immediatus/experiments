<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Instruments take over the meeting, one group at a time</title>
<desc>How often a better and a worse design are adopted as instruments heard before the vote are added one at a time, for each of three ways the groups combine their views. Meeting alone: better designs 40%, 79% and 45%; worse 2%, 8% and 2%. With a debate heard first, better 61% to 80% and worse 5% to 9%; with a reader added, better 88% to 91% and worse 5% to 6%; with a verified critic, better 93% to 94% and worse 2%.</desc>
