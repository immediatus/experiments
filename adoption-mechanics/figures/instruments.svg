<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Instruments take over the meeting</title>
<desc>How often a better and a worse design are adopted as instruments heard before the vote are added one at a time, for each of three ways the groups combine their views. Meeting alone: better designs 40%, 79% and 45%; worse 2%, 8% and 2%. With a debate heard first all three give 73% and 24%; with a reader added, 90% and 8%; with a verified critic, better 91% to 94% and worse 1% to 2%.</desc>
