<title>Split the reading, not the design</title>
<desc>The chance a model uses the decisive fact of a design document that fills its context window, read whole or in 2, 4 or 8 overlapping parts. A fact in one place: 63%, 79%, 85%, 89%. A fact that needs two distant passages: 40%, 42%, 25%, 14%.</desc>
