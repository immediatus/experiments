<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>What each instrument buys</title>
<desc>How often the running review adopts a better and a worse design with each instrument, and with the best combination. The meeting alone: better 40%, worse 2%. Agreement mediator: better 79%, worse 8%. Pooled by reliability: better 45%, worse 2%. Debate heard first: better 65%, worse 6%. Debate heard after: better 40%, worse 2%. Model reads in parts: better 85%, worse 4%. Verified critic: better 94%, worse 14%. Contrarian critic: better 0%, worse 0%. Reader, debate and critic: better 94%, worse 2%.</desc>
