<text x="41.00" y="145.85" text-anchor="end" class="f-sub">75%</text>
<path d="M46.00 24.50 H682.00" class="s-grid" fill="none"/>
<text x="41.00" y="27.85" text-anchor="end" class="f-sub">100%</text>
<text x="46.00" y="272.80" text-anchor="start" class="f-sub">50%</text>
<text x="173.00" y="272.80" text-anchor="middle" class="f-sub">60%</text>
<text x="300.00" y="272.80" text-anchor="middle" class="f-sub">70%</text>
<text x="428.00" y="272.80" text-anchor="middle" class="f-sub">80%</text>
<text x="555.00" y="272.80" text-anchor="middle" class="f-sub">90%</text>
<text x="682.00" y="272.80" text-anchor="end" class="f-sub">100%</text>
<path d="M46.00 258.50 H682.00" class="s-sub" fill="none"/>
<text x="46.00" y="12.80" text-anchor="start" class="f-ink">how often the review is right</text>
<text x="682.00" y="295.80" text-anchor="end" class="f-ink">how often the instrument heard first is right</text>
<rect x="300.40" y="24.00" width="153.53" height="234.00" class="f-a" fill-opacity="0.08"/>
<path d="M46.00 258.00 L682.00 24.00" class="s-g" fill="none" stroke-width="1" stroke-dasharray="5 4"/>
