<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Who speaks first (Proposition 7)</title>
<desc>How often a review of 15 members, each right 70% of the time with errors correlated at 0.25, is right, against how often an AI verdict is right. Heard first, the verdict is ignored up to 70%, where the review is right 82.1% of the time; above it every member follows the verdict and the review is right exactly as often as the verdict, which is worse than the room between 70% and 82.1%. With answers recorded first the review stays at 82.1% whatever the verdict.</desc>
<style>.f-ink{fill:#333}.s-ink{stroke:#333}.f-sub{fill:#555}.s-sub{stroke:#555}.f-grid{fill:#d6d6d6}.s-grid{stroke:#d6d6d6}.f-a{fill:#b71c1c}.s-a{stroke:#b71c1c}.f-b{fill:#1565c0}.s-b{stroke:#1565c0}.f-c{fill:#2e7d32}.s-c{stroke:#2e7d32}.f-d{fill:#e65100}.s-d{stroke:#e65100}.f-e{fill:#6a1b9a}.s-e{stroke:#6a1b9a}.f-g{fill:#777}.s-g{stroke:#777}.f-bg{fill:#fff}.s-bg{stroke:#fff}@media (prefers-color-scheme: dark){.f-ink{fill:#ddd}.s-ink{stroke:#ddd}.f-sub{fill:#aaa}.s-sub{stroke:#aaa}.f-grid{fill:#444}.s-grid{stroke:#444}.f-a{fill:#ef9a9a}.s-a{stroke:#ef9a9a}.f-b{fill:#8ab4f8}.s-b{stroke:#8ab4f8}.f-c{fill:#81c784}.s-c{stroke:#81c784}.f-d{fill:#ffcc80}.s-d{stroke:#ffcc80}.f-e{fill:#ce93d8}.s-e{stroke:#ce93d8}.f-g{fill:#bbb}.s-g{stroke:#bbb}.f-bg{fill:#1e1e1e}.s-bg{stroke:#1e1e1e}}</style>
<rect x="0" y="0" width="700" height="230" class="f-bg"/>
<text x="14.00" y="202.80" text-anchor="start" class="f-sub">50%</text>
<text x="148.00" y="202.80" text-anchor="middle" class="f-sub">60%</text>
<text x="283.00" y="202.80" text-anchor="middle" class="f-sub">70%</text>
<text x="417.00" y="202.80" text-anchor="middle" class="f-sub">80%</text>
<text x="552.00" y="202.80" text-anchor="middle" class="f-sub">90%</text>
<text x="686.00" y="202.80" text-anchor="end" class="f-sub">100%</text>
<path d="M14.00 188.50 H686.00" class="s-sub" fill="none"/>
<text x="14.00" y="12.80" text-anchor="start" class="f-ink"></text>
<text x="686.00" y="225.80" text-anchor="end" class="f-ink">how often the AI verdict is right</text>
<rect x="14.00" y="61.92" width="268.80" height="44.50" class="f-g" fill-opacity="0.15"/>
<rect x="282.80" y="61.92" width="162.22" height="44.50" class="f-a" fill-opacity="0.25"/>
<rect x="445.02" y="61.92" width="240.98" height="44.50" class="f-b" fill-opacity="0.18"/>
<rect x="14.00" y="136.08" width="672.00" height="44.50" class="f-g" fill-opacity="0.15"/>
<path d="M282.80 106.42 L282.80 10.00" class="s-sub" fill="none" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M445.02 106.42 L445.02 10.00" class="s-sub" fill="none" stroke-width="1" stroke-dasharray="5 4"/>
<text x="278.00" y="24.85" text-anchor="end" class="f-sub">one reviewer: 70%</text>
<text x="450.00" y="24.85" text-anchor="start" class="f-sub">the room alone: 82.1%</text>
<text x="16.00" y="50.85" text-anchor="start" class="f-ink" font-weight="bold">AI heard first</text>
<text x="16.00" y="124.85" text-anchor="start" class="f-ink" font-weight="bold">Answers recorded first</text>
<text x="148.00" y="87.85" text-anchor="middle" class="f-ink">ignored: right 82.1%</text>
<text x="364.00" y="87.85" text-anchor="middle" class="f-a" font-weight="bold">copied: worse</text>
<text x="566.00" y="87.85" text-anchor="middle" class="f-b" font-weight="bold">copied: as good as the AI</text>
<text x="350.00" y="161.85" text-anchor="middle" class="f-ink">nothing to copy: the room decides, right 82.1%</text>
</svg>
