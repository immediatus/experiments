<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>What each choice buys</title>
<desc>How often a review adopts a better and a worse design: today, with each lever alone, with all six, and with the status quo inside the approvers' hull. Today: better 72%, worse 20%. Decorrelated panel: better 74%, worse 17%. Reversible pilot: better 76%, worse 21%. Fewer hand-offs: better 75%, worse 21%. One gate removed: better 73%, worse 20%. Champion speaks first: better 84%, worse 38%. Blind vote: better 43%, worse 4%. All six levers: better 71%, worse 7%. Status quo in the hull: better 0%, worse 0%.</desc>
