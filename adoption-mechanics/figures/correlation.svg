<title>What stronger models share</title>
<desc>Odds ratio that two language models make the same mistake, by fifth of model pairs ordered by mean accuracy, on three benchmarks from Stanford HELM. MMLU, all questions: 1.84, 7.65, 9.22, 10.77, 13.38; questions of similar difficulty: 1.08, 1.09, 1.04, 1.00, 1.25. GPQA, all questions: 2.65, 2.96, 3.08, 4.62, 9.11; questions of similar difficulty: 1.36, 1.01, 0.82, 0.90, 1.81. MMLU-Pro, all questions: 3.88, 5.98, 7.87, 10.67, 18.73; questions of similar difficulty: 1.16, 1.05, 0.91, 1.04, 1.84.</desc>
