<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Where an upgrade takes a panel</title>
<desc>Member error against the latent correlation of members' errors, both on log scales, with curves of equal large-panel floor at 2%, 5%, 10%, 20%, 30%, 40%. An upgrade improves a large panel only if it ends on a lower curve. A constructed path from 30% error at correlation 0.10 to 10% at 0.65 moves the floor through 4.9%, 6.6%, 7.7%, 7.1%, 5.6%. Four MMLU accuracy tiers, from 44% error at correlation 0.68 to 25% at 0.78, move it through 43%, 35%, 29%, 22%.</desc>
