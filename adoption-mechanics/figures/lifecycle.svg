<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Where designs die</title>
<desc>Where reviews of the same design end, out of 100 reviews of a better and of a worse design: stopped in the team review, lost in the managers' hand-off, stopped at the approvals, or adopted. Groups decide apart: better design 54 stopped in the team review, 5 lost in the hand-off, 1 stopped at the approvals, 40 adopted; worse design 98 stopped in the team review, 0 lost in the hand-off, 0 stopped at the approvals, 2 adopted. The groups meet in one room: better design 22 stopped in the team review, 5 lost in the hand-off, 1 stopped at the approvals, 72 adopted; worse design 78 stopped in the team review, 2 lost in the hand-off, 1 stopped at the approvals, 19 adopted. One room, the champion speaks first: better design 11 stopped in the team review, 4 lost in the hand-off, 1 stopped at the approvals, 84 adopted; worse design 59 stopped in the team review, 3 lost in the hand-off, 0 stopped at the approvals, 38 adopted. One room, the champion speaks first, the status quo among the approvers' priorities: better design 11 stopped in the team review, 0 lost in the hand-off, 89 stopped at the approvals, 0 adopted; worse design 59 stopped in the team review, 0 lost in the hand-off, 41 stopped at the approvals, 0 adopted.</desc>
