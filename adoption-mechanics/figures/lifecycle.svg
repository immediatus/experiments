<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" width="700" height="334" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Where designs die</title>
<desc>Where reviews of a better and a worse design end, in four settings. Groups decide apart, better design: stopped in the team review 54%, lost in the hand-off 5%, stopped at the approvals 1%, adopted 40%. Groups decide apart, worse design: stopped in the team review 98%, lost in the hand-off 0%, stopped at the approvals 0%, adopted 2%. One room, better design: stopped in the team review 22%, lost in the hand-off 5%, stopped at the approvals 1%, adopted 72%. One room, worse design: stopped in the team review 78%, lost in the hand-off 2%, stopped at the approvals 0%, adopted 19%. One room, champion first, better design: stopped in the team review 11%, lost in the hand-off 4%, stopped at the approvals 1%, adopted 84%. One room, champion first, worse design: stopped in the team review 59%, lost in the hand-off 3%, stopped at the approvals 0%, adopted 38%. Status quo among priorities, better design: stopped in the team review 11%, lost in the hand-off 0%, stopped at the approvals 89%, adopted 0%. Status quo among priorities, worse design: stopped in the team review 59%, lost in the hand-off 0%, stopped at the approvals 41%, adopted 0%.</desc>
