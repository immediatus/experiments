name: checks

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"     # weekly, Monday 05:00 UTC: the full reproduction
  workflow_dispatch:

# The checks only read the repository.
permissions:
  contents: read

# A newer run of the same kind on the same branch, tag or pull request supersedes a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Every fast check
        run: python tools/check_all.py

  full:
    name: full reproduction (Python ${{ matrix.python }})
    # Weekly, on release tags and on demand. In a public repository GitHub disables scheduled
    # workflows after 60 days without repository activity; re-enable it from the Actions tab.
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Every check, with each experiment's byte-for-byte reproduction
        run: python tools/check_all.py --full

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
