<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Pods each minute over the last hour of a twenty-hour run, with demand flat at two hundred pods' worth, a 90-second dead time and the default 300-second window</title>
<desc>Pods over the last hour of a twenty-hour run with flat demand needing 200 pods, sampled every minute. Standing delay 60 seconds, in red: the count sits at 350 pods for six to seven minutes, drops within two minutes to between 56 and 124 pods, climbs back over the next two to three minutes, and repeats about every ten minutes. Standing delay 150 seconds, in green: the count stays at exactly 200 for the whole hour.</desc>
