<title>Peak backlog against the size of the overload, both on log scales</title>
<desc>Peak backlog in seconds of the original load against overload, both on log scales: 105 at 3x, 447 at 5x, 1,836 at 10x, 10,530 at 30x, 55,869 at 100x and 224,841 at 300x. A dashed line shows growth in proportion to the overload from the 3x point, reaching 10,500 at 300x; the measured backlog rises above it more steeply.</desc>
