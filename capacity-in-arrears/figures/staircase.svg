<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Pods ordered after a load step of 3x, 10x and 30x in the running specimen, on a doubling scale</title>
<desc>Pods ordered against time for overloads of three, ten and thirty times, on a doubling scale. All three lines are identical for the first 150 seconds: 10 pods, then 20 ordered, then 40 ordered. The three-times line stops at 40 and later falls to 30. The ten-times line continues to 80, 159 and 317. The thirty-times line continues to 630 and then past 1,000. Dashed lines mark the pods at which capacity first meets each load: 15, 50 and 150.</desc>
