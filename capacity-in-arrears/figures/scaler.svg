<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>An autoscaler that counts first attempts only holds ρ at its target, so it lands at A·ρ = A × target</title>
<desc>Time until healthy after a sustained tenfold step, for an autoscaler driven by first attempts only. Sorted by amplified utilization: retry budget 20% at a 50% target, A times rho 0.60, 274 s; budget 50%, 0.75, 422 s; 2 retries at 25%, 0.75, 384 s; at 30%, 0.90, 922 s; at 33%, 0.99, 8,909 s. Trapped, never healthy: 2 retries at a 50% target, 1.50, with or without a 5-second backoff.</desc>
<style>.f-ink{fill:#333}.s-ink{stroke:#333}.f-sub{fill:#555}.s-sub{stroke:#555}.f-grid{fill:#d6d6d6}.s-grid{stroke:#d6d6d6}.f-a{fill:#b71c1c}.s-a{stroke:#b71c1c}.f-b{fill:#1565c0}.s-b{stroke:#1565c0}.f-c{fill:#2e7d32}.s-c{stroke:#2e7d32}.f-d{fill:#e65100}.s-d{stroke:#e65100}.f-e{fill:#6a1b9a}.s-e{stroke:#6a1b9a}.f-g{fill:#777}.s-g{stroke:#777}.f-bg{fill:#fff}.s-bg{stroke:#fff}@media (prefers-color-scheme: dark){.f-ink{fill:#ddd}.s-ink{stroke:#ddd}.f-sub{fill:#aaa}.s-sub{stroke:#aaa}.f-grid{fill:#444}.s-grid{stroke:#444}.f-a{fill:#ef9a9a}.s-a{stroke:#ef9a9a}.f-b{fill:#8ab4f8}.s-b{stroke:#8ab4f8}.f-c{fill:#81c784}.s-c{stroke:#81c784}.f-d{fill:#ffcc80}.s-d{stroke:#ffcc80}.f-e{fill:#ce93d8}.s-e{stroke:#ce93d8}.f-g{fill:#bbb}.s-g{stroke:#bbb}.f-bg{fill:#1e1e1e}.s-bg{stroke:#1e1e1e}}</style>
<rect x="0" y="0" width="700" height="330" class="f-bg"/>
<text x="10.00" y="304.80" text-anchor="start" class="f-sub">100 s</text>
<text x="282.00" y="304.80" text-anchor="middle" class="f-sub">1,000 s</text>
<text x="554.00" y="304.80" text-anchor="middle" class="f-sub">10,000 s</text>
<path d="M10.00 290.50 H684.00" class="s-sub" fill="none"/>
<text x="10.00" y="12.80" text-anchor="start" class="f-ink">first-attempt signal: target and retry policy</text>
<text x="684.00" y="325.80" text-anchor="end" class="f-ink">time until healthy after a sustained tenfold step (log)</text>
<circle cx="129.11" cy="48.63" r="6" class="f-b"/>
<text x="139.00" y="52.85" text-anchor="start" class="f-b" font-weight="bold">274 s</text>
<text x="10.00" y="36.80" text-anchor="start" class="f-ink">50%, retry budget 20%   A·ρ = 0.60</text>
<circle cx="168.99" cy="85.20" r="6" class="f-b"/>
<text x="179.00" y="88.85" text-anchor="start" class="f-b" font-weight="bold">384 s</text>
<text x="10.00" y="72.80" text-anchor="start" class="f-ink">25%, 2 retries   A·ρ = 0.75</text>
<circle cx="180.14" cy="121.77" r="6" class="f-b"/>
<text x="190.00" y="125.85" text-anchor="start" class="f-b" font-weight="bold">422 s</text>
<text x="10.00" y="109.80" text-anchor="start" class="f-ink">50%, retry budget 50%   A·ρ = 0.75</text>
<circle cx="272.49" cy="158.34" r="6" class="f-b"/>
<text x="282.00" y="161.85" text-anchor="start" class="f-b" font-weight="bold">922 s</text>
<text x="10.00" y="145.80" text-anchor="start" class="f-ink">30%, 2 retries   A·ρ = 0.90</text>
<circle cx="540.53" cy="194.91" r="6" class="f-b"/>
<text x="551.00" y="198.85" text-anchor="start" class="f-b" font-weight="bold">8,909 s</text>
<text x="10.00" y="182.80" text-anchor="start" class="f-ink">33%, 2 retries   A·ρ = 0.99</text>
<text x="680.00" y="234.85" text-anchor="end" class="f-a" font-weight="bold">never recovers: trapped</text>
<text x="10.00" y="218.80" text-anchor="start" class="f-ink">50%, 2 retries   A·ρ = 1.50</text>
<text x="680.00" y="271.85" text-anchor="end" class="f-a" font-weight="bold">never recovers: trapped</text>
<text x="10.00" y="255.80" text-anchor="start" class="f-ink">50%, 2 retries, backoff 5 s   A·ρ = 1.50</text>
</svg>
