<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>The ported external per-pod calculation swept over the backlog, for three current replica counts</title>
<desc>Recommendation of the ported external per-pod calculation, threshold 10 messages per pod, against backlog from 0 to 5,000 messages, for 100, 200 and 300 current replicas. All three lines follow backlog divided by 10, from 0 to 500, except for a flat step where each holds its current count: 100 replicas between 900 and 1,100 messages, 200 between 1,800 and 2,200, and 300 between 2,700 and 3,300.</desc>
