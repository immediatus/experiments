<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Φ(w), the standing delay the idealized loop needs, against the window measured in dead times</title>
<desc>Standing delay needed, in dead times, against the window over the dead time on a log scale. The computed curve rises from 0.119 at w = 0.1 to 0.384 at 0.5, 0.573 at 1, 0.916 at 3.33, 1.213 at 10, 1.539 at 40, 1.719 at 100 and 1.938 at 400. The closed-form harmonic-balance approximation follows it closely from 1 to about 3 and then rises too fast; the asymptotic form e over one plus 30.6 over the squared log of w over 0.07 follows it from about 3 to 400. Dashed lines mark e, the ceiling of Proposition 5, and 2 over pi for the pure-delay loop.</desc>
