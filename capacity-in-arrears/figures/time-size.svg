<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Size against time under heavy-tailed overloads, at matching percentiles</title>
<desc>Time until capacity meets the load against the overload, at the median, 90th and 99th percentile of 3,000 Pareto overloads with tail index 1.5, overload on a log scale. CPU signal: 105 s at 2.3x, 240 s at 6.9x, 480 s at 31.3x. First-attempt signal behind a 5-second admission bound: 105, 120 and 135 s at the same overloads.</desc>
