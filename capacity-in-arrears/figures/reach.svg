<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>One sync of the ported CPU calculation, swept over the pods already ordered</title>
<desc>Pods ordered by one sync of the ported CPU calculation against the replicas already there, ready plus on order, with every ready pod at its limit and a 50% target. With 10 ready the sync orders 10 pods when nothing is on order and one fewer for each pod already ordered, reaching zero at 18 replicas, two short of twice the ready pods. With 20 ready it orders 20, falling to zero at 36 replicas.</desc>
