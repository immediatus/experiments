<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>The ingress-rate scaler under the same step and on the same scales</title>
<desc>Ingress-rate scaler after the same step. Pods rise to 300 by 180 seconds, the work served is all abandoned attempts until between 240 and 270 seconds, then good work returns to all 5,000 requests a second, wasted work falls to zero, and pods fall back to 100.</desc>
