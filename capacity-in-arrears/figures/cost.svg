<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>The price of stability at a 90-second dead time and the default window</title>
<desc>Pods against standing delay at a 90 s dead time and the default window, 200 pods needed. Noise-free, the 5th to 95th percentile band is 80 to 503 pods at 40 s, 93 to 350 at 60 s, 104 to 283 at 80 s, and from 100 s on between 184 and 206, exactly 200 at 100, 150 and 200 s. With 30% demand noise the band is wider at every delay but narrows sharply across the same boundary, observed at 85.5 s. Mean pods, red line: 397 at 40 s, 290 at 60 s, 234 at 80 s and 199 to 201 from 100 s on, that is 99%, 45% and 17% above the need, and then within 1% of it.</desc>
