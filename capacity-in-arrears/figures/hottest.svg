<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>The hottest whole-percent target Corollary 2 allows for each overload and round budget, with the limit equal to the request</title>
<desc>Hottest target allowed by Corollary 2 against the round budget, one curve per overload. 3x: 57, 69, 80, 85 and 93% for budgets of 1, 2, 4, 6 and 15 rounds. 10x: 31, 46, 63, 71, 86%. 30x: 18, 32, 50, 61, 80%. 100x: 10, 21, 39, 51, 74%. Targets of 91% and above fall in a shaded dead band. Three simulated cells miss their budget and are circled: 3x at 93% never scales, 10x at 63% takes 585 s, 100x at 10% takes 210 s.</desc>
