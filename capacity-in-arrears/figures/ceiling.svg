<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>A replica ceiling against the amplified load</title>
<desc>Recovery time after a tenfold 300-second spike against the replica ceiling, with two retries and a CPU signal; the amplified load needs 15 pods. Ceilings of 14 and 15 never recover. A ceiling of 16 recovers after 40,293 seconds, 20 after 7,921, 25 after 3,925 and 40 after 1,530, close to a constant divided by the margin above 15.</desc>
