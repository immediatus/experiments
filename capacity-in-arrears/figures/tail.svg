<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>What an admission bound does to the tail, in 99th percentiles over 3,000 heavy-tailed overloads</title>
<desc>99th percentiles over 3,000 Pareto overloads with tail index 1.5, CPU signal, 10-second timeout, two retries, by admission bound. Peak backlog: 50,563 with no bound, 27,181 at 60 s, 9,810 at 20 s, 1,633 at 12 s, 190 at 8 s, 113 at 5 s and 32 at 2 s. Rejected or lost: 30,905, 29,088, 26,080, 22,064, 10,979, 11,056 and 11,137. Between 12 s and 8 s, either side of the timeout, the loss halves. A dashed line at 11,170 marks the peak backlog of the same overloads with no timeouts or retries at all. Filled points are peak backlog, open points rejected or lost; the bounds are categories, so the points are not joined.</desc>
