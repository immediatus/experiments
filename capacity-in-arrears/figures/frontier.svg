<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>The achievable region of Definition 3 for a thirtyfold overload</title>
<desc>Rounds to meet a thirtyfold overload against pods held per pod of steady demand. With the limit equal to the request: 25% target holds 4.00 and takes 2 rounds, 50% holds 2.00 and takes 4, 60% holds 1.67 and takes 6, 70% holds 1.43 and takes 9, 80% holds 1.25 and takes 15. At a 50% target, a limit twice the request takes 2 rounds and four times takes 1, both holding 2.00, which dominates the 25% point.</desc>
