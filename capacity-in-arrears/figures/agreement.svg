<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Each point is one pair of dead time and window; for each dead time, the windows of 60, 120, 300 and 600 seconds give the four points from left to right</title>
<desc>Observed hunting boundary of the deployed loop against the prediction with ten seconds of sampling delay, for sixteen pairs of dead time and window. Points lie along the diagonal. Four fall outside the ten percent band, all with the prediction above the observation: dead time 30 s with windows of 120 and 300 s, 60 s with 300 s, and 90 s with 600 s, the last by a hair; the largest miss is 30 s and 120 s, predicted 36.4 s, observed 31.8 s. At a 90 s dead time the default 300 s window is predicted at 89.6 s and observed at 85.5 s.</desc>
