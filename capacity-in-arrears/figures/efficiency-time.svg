<title>What degradation under load does to the time until capacity meets the load, for a tenfold and a thirtyfold overload</title>
<desc>Time until capacity meets the load against the rate a saturated pod still serves. Tenfold overload: 345 s at 100% and 80%, 465 s at 60% and 40%. Thirtyfold: 480 s at 100%, 585 s at 80% and 60%, 705 s at 40%.</desc>
