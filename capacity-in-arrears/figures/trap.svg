<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Recovery time of a fixed-capacity service after a 300-second tenfold spike, against A·ρ</title>
<desc>Recovery time after a 300-second tenfold spike against amplified utilization A times rho, log scale. The derived curve rises from 2,400 s at 0.5 to 3,750 s at 0.6, 10,500 s at 0.8, 19,500 s at 0.88 and 64,500 s at 0.96, diverging at 1. Fluid-model points (open circles), request-level runs (small dots) and retry-budget runs (green) sit on it. At A times rho of 1.0, 1.2, 1.5 and 1.6 every run is stuck.</desc>
