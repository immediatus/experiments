<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>How sure the tail indices are</title>
<desc>Hill estimates of the tail index over 3,000 Pareto overloads with true index 1.5, with 90% bootstrap bands, as the share of the sample treated as the tail runs from 2% to 30%. Overload K: 1.79 at 2%, 1.63 at 5%, 1.57 at 10%, 1.56 at 20%, 1.51 at 30%. Peak backlog with no bound: 1.23 at 2%, 1.04 at 5%, 0.89 at 10%, 0.75 at 20%, 0.65 at 30%. At the 10% share the bands are 1.46 to 1.72 and 0.83 to 0.97 and do not overlap. Refused or lost work behind a 5-second bound follows the backlog at every share, 0.88 at 10%.</desc>
