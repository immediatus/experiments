<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Parts 3 and 4 on one map, for a sustained tenfold step with a 10-second timeout: each signal and lever by the pods it holds per pod of demand and the work it loses</title>
<desc>Every signal and lever under the same sustained tenfold step, on common axes: pods held over the hour after the step per pod of stepped demand at full rate, against first-attempt work lost in seconds of the stepped demand. CPU 4.70 pods and 736 s lost; ingress 2.56 pods and 228 s lost; first attempts 1.98 pods and 3,566 s lost with the service still failing; first attempts, target 30% 3.30 pods and 878 s lost; first attempts, target 25% 3.96 pods and 338 s lost; first attempts, budget 20% 1.98 pods and 249 s lost; first attempts, budget 50% 1.98 pods and 390 s lost; first attempts, bound 5 s 1.98 pods and 87 s lost; CPU, bound 5 s 1.88 pods and 180 s lost. The pair signal coincides with ingress. The frontier runs through CPU, bound 5 s and first attempts, bound 5 s.</desc>
