<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>The largest gain at which the stale ratio rule still settles, against how many sync periods old its replica count is</title>
<desc>Largest stable gain against staleness in sync periods. The exact bound falls from 2.000 at zero periods to 1.000 at one, 0.618 at two, 0.445 at three and 0.347 at four. The sufficient bound one over one plus d lies below it. The one-line rule has gain 1, which touches the exact bound at one period and lies above it from two periods on.</desc>
