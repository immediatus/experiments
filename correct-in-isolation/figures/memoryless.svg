<title>No middle setting is ever the cheapest</title>
<desc>Expected node-hours held against expected time to capacity for a second 30x surge, gaps exponential, one point per unneeded time. mean gap 600 s: unneeded 0 s 3.80 node-hours 727.8 s; unneeded 300 s 6.11 node-hours 610.8 s; unneeded 600 s 7.51 node-hours 456.4 s; unneeded 900 s 8.36 node-hours 362.7 s; unneeded 1200 s 8.87 node-hours 305.9 s; unneeded 1800 s 9.37 node-hours 250.6 s; unneeded 3600 s 9.65 node-hours 220.0 s; unneeded forever s 9.67 node-hours 218.4 s. mean gap 1800 s: unneeded 0 s 4.45 node-hours 1015.8 s; unneeded 300 s 8.22 node-hours 954.5 s; unneeded 600 s 11.41 node-hours 854.8 s; unneeded 900 s 14.11 node-hours 770.3 s; unneeded 1200 s 16.40 node-hours 698.8 s; unneeded 1800 s 19.97 node-hours 587.1 s; unneeded 3600 s 25.68 node-hours 408.6 s; unneeded forever s 29.00 node-hours 304.7 s. Dashed lines join releasing at once to holding forever; every intermediate point lies above them.</desc>
