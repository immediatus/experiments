<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>What the second pass buys and what a match link takes away</title>
<desc>Share of orders of an enabling chain of n webhooks that reach the common fixed point. Value links, opted in, two passes: 2: 1.0000, 3: 0.8333, 4: 0.5000, 5: 0.2250, 6: 0.0806. Value links whose members run once, and match links at any number of passes: 2: 0.5000, 3: 0.1667, 4: 0.0417, 5: 0.0083, 6: 0.0014.</desc>
