<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>How much the memory autoscaler disturbs the CPU autoscaler, as the heap takes a smaller share of a pod's memory</title>
<desc>Relative gain of the CPU loop in the split pairing against the heap's share of the memory a pod uses, for a live set that does not follow load, at the largest coupling that share allows; a gain of 1 means the loops are independent. Collectors of OpenJDK 17, measured by Cai and coauthors in 2022. Parallel, beta 1.28: 24.97 at 25%, 2.78 at 50%, 1.47 at 75%; Serial, beta 0.40: 1.43 at 25%, 1.25 at 50%, 1.11 at 75%; G1, beta 0.58: 1.77 at 25%, 1.41 at 50%, 1.17 at 75%; Shenandoah, beta 0.55: 1.7 at 25%, 1.38 at 50%, 1.16 at 75%; ZGC, beta 0.60: 1.81 at 25%, 1.43 at 50%, 1.18 at 75%. Only the Parallel collector turns singular, at a heap of 21.9% of memory, and is reversed below it.</desc>
