<title>The log tames the time, not the shortfall</title>
<desc>Mean pod-seconds short (left, log scale) and mean nested time to capacity (right) against the tail exponent of surge sizes. Nested: 1.1: 716771, 1.2: 185401, 1.5: 32776, 2: 9600, 3: 3200. Node loop that sees the final need: 248631, 72420, 16553, 6240, 2640. Ample nodes: 215031, 55620, 9833, 2880, 960. Mean nested time: 0.69: 789 s, 1: 600 s, 1.1: 562 s, 1.2: 531 s, 1.5: 464 s, 2: 400 s, 3: 343 s. At or below an exponent of 1 the mean shortfall is infinite.</desc>
