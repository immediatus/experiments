<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Each point is one setting of the node loop's unneeded time, for a second surge 1200 seconds after the first</title>
<desc>Node-hours held against time until capacity meets a second 30x surge 1200 seconds after the first, one point per unneeded time. 0 s: 4.75 node-hours, 1200 s; 60 s: 5.72 node-hours, 1200 s; 300 s: 9.59 node-hours, 1200 s; 600 s: 14.42 node-hours, 1200 s; 900 s: 19.25 node-hours, 1200 s; 1000 s: 19.33 node-hours, 780 s; 1080 s: 19.33 node-hours, 780 s; 1140 s: 19.33 node-hours, 570 s; 1170 s: 19.33 node-hours, 570 s; 1200 s: 19.33 node-hours, 360 s; 1800 s: 19.33 node-hours, 360 s. Only releasing at once and holding through the gap are efficient.</desc>
<style>.f-ink{fill:#333}.s-ink{stroke:#333}.f-sub{fill:#555}.s-sub{stroke:#555}.f-grid{fill:#d6d6d6}.s-grid{stroke:#d6d6d6}.f-a{fill:#b71c1c}.s-a{stroke:#b71c1c}.f-b{fill:#1565c0}.s-b{stroke:#1565c0}.f-c{fill:#2e7d32}.s-c{stroke:#2e7d32}.f-d{fill:#e65100}.s-d{stroke:#e65100}.f-e{fill:#6a1b9a}.s-e{stroke:#6a1b9a}.f-g{fill:#777}.s-g{stroke:#777}.f-bg{fill:#fff}.s-bg{stroke:#fff}@media (prefers-color-scheme: dark){.f-ink{fill:#ddd}.s-ink{stroke:#ddd}.f-sub{fill:#aaa}.s-sub{stroke:#aaa}.f-grid{fill:#444}.s-grid{stroke:#444}.f-a{fill:#ef9a9a}.s-a{stroke:#ef9a9a}.f-b{fill:#8ab4f8}.s-b{stroke:#8ab4f8}.f-c{fill:#81c784}.s-c{stroke:#81c784}.f-d{fill:#ffcc80}.s-d{stroke:#ffcc80}.f-e{fill:#ce93d8}.s-e{stroke:#ce93d8}.f-g{fill:#bbb}.s-g{stroke:#bbb}.f-bg{fill:#1e1e1e}.s-bg{stroke:#1e1e1e}}</style>
