<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>What one rolling upgrade takes from an application whose pods need a webhook that rejects its own</title>
<desc>Share of 20000 rolling-upgrade orders in which the application loses 0, 1, 2 or 3 of its 3 replicas. out of reach: 0 lost 50%, 1 lost 30%, 2 lost 15%, 3 lost 5%. spread: 0 lost 46%, 1 lost 30%, 2 lost 17%, 3 lost 6%. packed: 0 lost 37%, 1 lost 0%, 2 lost 0%, 3 lost 63%.</desc>
