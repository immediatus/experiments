<title>Where in the chain the default does its damage</title>
<desc>Share of orders of a chain of value links that converge under two passes, against the position of the last member that runs once, counting the first as 0. 4 webhooks: 0: 0.5000, 1: 0.3750, 2: 0.1667, 3: 0.0417; 5 webhooks: 0: 0.2250, 1: 0.1917, 2: 0.1167, 3: 0.0417, 4: 0.0083; 6 webhooks: 0: 0.0806, 1: 0.0736, 2: 0.0542, 3: 0.0278, 4: 0.0083, 5: 0.0014. With passes enough: 0: 1.0000, 1: 0.5000, 2: 0.1667, 3: 0.0417, 4: 0.0083, 5: 0.0014.</desc>
