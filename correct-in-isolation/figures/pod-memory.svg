<title>The same memory is faster kept as pods</title>
<desc>Expected node-hours held against expected time to capacity for a second 30x surge, gaps exponential with a mean of 1800 s. Memory kept as nodes after the default 300-second pod window: unneeded 0 s 4.45 node-hours 1015.8 s; unneeded 300 s 8.22 node-hours 954.5 s; unneeded 600 s 11.41 node-hours 854.8 s; unneeded 900 s 14.11 node-hours 770.3 s; unneeded 1200 s 16.40 node-hours 698.8 s; unneeded 1800 s 19.97 node-hours 587.1 s; unneeded 3600 s 25.68 node-hours 408.6 s; unneeded forever s 29.00 node-hours 304.7 s. Memory kept as pods first, up to the 3600-second cap, then as nodes: stabilization 0 s unneeded 0 s 0.00 node-hours 1200.0 s; stabilization 300 s unneeded 0 s 4.45 node-hours 1015.8 s; stabilization 600 s unneeded 0 s 8.22 node-hours 859.8 s; stabilization 900 s unneeded 0 s 11.41 node-hours 727.8 s; stabilization 1500 s unneeded 0 s 16.40 node-hours 521.5 s; stabilization 3600 s unneeded 0 s 25.08 node-hours 162.4 s; stabilization 3600 s unneeded 600 s 26.19 node-hours 136.7 s; stabilization 3600 s unneeded 3600 s 28.47 node-hours 65.3 s; stabilization 3600 s unneeded forever s 29.00 node-hours 48.7 s.</desc>
