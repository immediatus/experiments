<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Time until capacity meets a surge, against the surge's size, with 90-second pods and 210-second nodes and no free slots</title>
<desc>Time until capacity meets a surge, against its size, for a pod loop nested in a node loop with no free slots. Nested: 3x 300 s, 5x 600 s, 10x 900 s, 30x 1200 s, 100x 1800 s. Node loop that sees the final need: 3x 300 s, 5x 390 s, 10x 480 s, 30x 570 s, 100x 750 s. Ample nodes: 3x 90 s, 5x 180 s, 10x 270 s, 30x 360 s, 100x 540 s.</desc>
