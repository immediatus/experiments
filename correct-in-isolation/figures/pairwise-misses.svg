<title>How often a failure is one no pair shows, in random systems</title>
<desc>Share of failing random systems that a check of every pair passes, against the number of mechanisms. Order, random fact graphs: 3: 0.8637, 4: 0.9470, 5: 0.9788. Signal, couplings within 0.8, reversed loops with every pair below 2: 3: 0.6532, 4: 0.7068, 5: 0.7032. Assumption, start-time graphs at probability 0.2 with no self-matching: 3: 0.0703, 4: 0.1176, 5: 0.1580, 6: 0.1792.</desc>
