<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>Headroom removes node waits one step at a time</title>
<desc>Time until capacity meets a 30x surge against free slots held in advance, as a multiple of 64 running pods. Closed-form steps at 56, 176, 416, 896 slots, to 1200, 990, 780, 570, 360 seconds. Simulated: 0 slots: 1200 s; 53 slots: 1290 s; 56 slots: 990 s; 64 slots: 990 s; 169 slots: 1080 s; 176 slots: 780 s; 192 slots: 780 s; 402 slots: 870 s; 416 slots: 570 s; 448 slots: 570 s; 896 slots: 360 s. Just short of a step, 53 slots take 1290 s; 169 slots take 1080 s; 402 slots take 870 s.</desc>
