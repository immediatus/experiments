<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11">
<title>A heavy tail scatters clusters across the boundary</title>
<desc>Share of clusters whose full-trigger backlog passes the storm boundary, against the number of informers, for list costs Pareto with exponents 3, 2, 1.5 and 1.2 and a mean that puts 2,000 informers at the boundary on average. Exponent 3: 0 up to 1800, 0.498 at 2000, 1 from 2200. Exponent 2: 0 up to 1500, 0.011 at 1800, 0.451 at 2000, 1 from 2200. Exponent 1.5: 0.004 at 1000, 0.029 at 1500, 0.110 at 1800, 0.335 at 2000, 0.855 at 2200, 1 from 2500. Exponent 1.2: 0.022 at 1000, 0.065 at 1500, 0.120 at 1800, 0.177 at 2000, 0.278 at 2200, 0.548 at 2500, 0.976 at 3000.</desc>
